name: BSC address-poisoning scan (resumable)

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4h; resumes incomplete shards, never exceeds job limits
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bsc-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          # Full 2023 (block ~24.4M -> ~34.88M), 24 half-month slices (~437k blocks each)
          - { name: 2023s01, from: 24400000, to: 24836665 }
          - { name: 2023s02, from: 24836666, to: 25273331 }
          - { name: 2023s03, from: 25273332, to: 25709997 }
          - { name: 2023s04, from: 25709998, to: 26146663 }
          - { name: 2023s05, from: 26146664, to: 26583329 }
          - { name: 2023s06, from: 26583330, to: 27019995 }
          - { name: 2023s07, from: 27019996, to: 27456661 }
          - { name: 2023s08, from: 27456662, to: 27893327 }
          - { name: 2023s09, from: 27893328, to: 28329993 }
          - { name: 2023s10, from: 28329994, to: 28766659 }
          - { name: 2023s11, from: 28766660, to: 29203325 }
          - { name: 2023s12, from: 29203326, to: 29639991 }
          - { name: 2023s13, from: 29639992, to: 30076657 }
          - { name: 2023s14, from: 30076658, to: 30513323 }
          - { name: 2023s15, from: 30513324, to: 30949989 }
          - { name: 2023s16, from: 30949990, to: 31386655 }
          - { name: 2023s17, from: 31386656, to: 31823321 }
          - { name: 2023s18, from: 31823322, to: 32259987 }
          - { name: 2023s19, from: 32259988, to: 32696653 }
          - { name: 2023s20, from: 32696654, to: 33133319 }
          - { name: 2023s21, from: 33133320, to: 33569985 }
          - { name: 2023s22, from: 33569986, to: 34006651 }
          - { name: 2023s23, from: 34006652, to: 34443317 }
          - { name: 2023s24, from: 34443318, to: 34880000 }
    env:
      BLOCKPI_BSC: ${{ secrets.BLOCKPI_BSC }}
      NODEREAL_BSC: ${{ secrets.NODEREAL_BSC }}
      BSC_ALCHEMY_URL: ${{ secrets.BSC_ALCHEMY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore scan state branch
        run: |
          git fetch origin scan-state || true
          git checkout origin/scan-state -- state results 2>/dev/null || true
      - name: Scan shard (time-budgeted)
        continue-on-error: true
        run: |
          python -m src.logs_scan \
            --shard ${{ matrix.shard.name }} \
            --from-block ${{ matrix.shard.from }} \
            --to-block ${{ matrix.shard.to }} \
            --state state/${{ matrix.shard.name }}.json \
            --results results \
            --time-budget 14400 \
            --workers 4
      - name: Commit state and results
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B scan-state
          git add -f state results
          git commit -m "scan ${{ matrix.shard.name }}" || true
          for i in 1 2 3 4 5; do
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" scan-state && break
            git pull --rebase --autostash origin scan-state || true
            git add -f state results
            git commit -m "scan ${{ matrix.shard.name }} (rebase)" || true
          done

  merge:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore accumulated results
        run: |
          git fetch origin scan-state || true
          git checkout origin/scan-state -- state results 2>/dev/null || true
      - name: Build comprehensive at-risk CSV
        run: python -m src.aggregate --in results --out eoas_at_risk.csv
      - uses: actions/upload-artifact@v4
        with:
          name: eoas_at_risk.csv
          path: eoas_at_risk.csv
      - name: Commit final CSV to scan-state
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B scan-state
          cp eoas_at_risk.csv results/eoas_at_risk.csv
          git add -f results/eoas_at_risk.csv
          git commit -m "update eoas_at_risk.csv" || true
          for i in 1 2 3 4 5; do
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" scan-state && break
            git pull --rebase --autostash origin scan-state || true
          done
