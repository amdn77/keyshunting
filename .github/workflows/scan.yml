name: BSC address-poisoning scan

on:
  schedule:
    - cron: "0 3 * * 0"   # weekly
  workflow_dispatch:
    inputs:
      from_block:
        description: "start block (hex or decimal)"
        required: true
        default: "13400000"
      to_block:
        description: "end block (hex or decimal)"
        required: true
        default: "14000000"

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          # 2023 sampled in 4 quarterly day-slices spanning the year (~1 day each)
          - { name: 2023q1, from: 24400000, to: 24428799 }
          - { name: 2023q2, from: 27200000, to: 27228799 }
          - { name: 2023q3, from: 30000000, to: 30028799 }
          - { name: 2023q4, from: 33000000, to: 33028799 }
    env:
      BLOCKPI_BSC: ${{ secrets.BLOCKPI_BSC }}
      NODEREAL_BSC: ${{ secrets.NODEREAL_BSC }}
      BSC_ALCHEMY_URL: ${{ secrets.BSC_ALCHEMY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch blocks
        run: python -m src.blocks --from-block ${{ matrix.shard.from }} --to-block ${{ matrix.shard.to }} --out shards/${{ matrix.shard.name }}
      - name: Detect
        run: python -m src.detect --in shards/${{ matrix.shard.name }} --out findings/${{ matrix.shard.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.shard.name }}
          path: |
            findings/${{ matrix.shard.name }}/
          retention-days: 30

  merge:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: findings
      - run: python -m src.aggregate --in findings --out eoas_at_risk.csv
      - uses: actions/upload-artifact@v4
        with:
          name: eoas_at_risk.csv
          path: eoas_at_risk.csv
